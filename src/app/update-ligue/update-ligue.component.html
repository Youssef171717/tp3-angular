<div class="container">
  <div class="card shadow mt-3">
    <div class="card-header text-white bg-success"><h4 class="mb-0">Modifier une Ligue</h4></div>
    <div class="card-body">
      <form>
        <div class="row g-3">
          <div class="col-sm-2">
            <label class="form-label">ID Ligue</label>
            <input readonly type="number" [(ngModel)]="currentLigue.idLigue" name="idLigue" class="form-control">
          </div>
          <div class="col-sm-4">
            <label class="form-label">Nom de la ligue</label>
            <input type="text" [(ngModel)]="currentLigue.nomLigue" name="nomLigue" class="form-control">
          </div>
          <div class="col-sm-3">
            <label class="form-label">Pays</label>
            <input type="text" [(ngModel)]="currentLigue.pays" name="pays" class="form-control">
          </div>
          <div class="col-sm-3">
            <label class="form-label">Nombre de clubs</label>
            <input type="number" [(ngModel)]="currentLigue.nbClubs" name="nbClubs" class="form-control">
          </div>
          <div class="col-sm-4">
            <label class="form-label">Date de création</label>
            <input type="date" [ngModel]="currentLigue.dateCreation | date: 'yyyy-MM-dd'" (ngModelChange)="currentLigue.dateCreation = $event" name="dateCreation" class="form-control">
          </div>
        </div>
        <div class="mt-3">
          <button type="submit" (click)="updateLigue()" class="btn btn-success">Modifier</button>
        </div>
        
      </form>
    </div>
  </div>
</div>
