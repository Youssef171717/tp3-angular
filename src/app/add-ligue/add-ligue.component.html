<div class="container">
  <div class="card shadow mt-3">
    <div class="card-header text-white bg-success"><h4 class="mb-0">Ajouter une Ligue</h4></div>
    <div class="card-body">
      <form>
        <div class="row g-3">
          <div class="col-sm-2">
            <label class="form-label">ID Ligue</label>
            <input  type="number" [(ngModel)]="newLigue.idLigue" name="idLigue" class="form-control">
          </div>
          <div class="col-sm-4">
            <label class="form-label">Nom de la ligue</label>
            <input type="text" [(ngModel)]="newLigue.nomLigue" name="nomLigue" class="form-control">
          </div>
          <div class="col-sm-3">
            <label class="form-label">Pays</label>
            <input type="text" [(ngModel)]="newLigue.pays" name="pays" class="form-control">
          </div>
          <div class="col-sm-3">
            <label class="form-label">Nombre de clubs</label>
            <input type="number" [(ngModel)]="newLigue.nbClubs" name="nbClubs" class="form-control">
          </div>
          <div class="col-sm-4">
            <label class="form-label">Date de création</label>
            <input type="date" [(ngModel)]="newLigue.dateCreation" name="dateCreation" class="form-control">
          </div>
        </div>
        <div class="mt-3">
          <button type="submit" (click)="addLigue()" class="btn btn-success">Ajouter</button>
        </div>
        <div class="mt-2"><h5>{{message}}</h5></div>
      </form>
    </div>
  </div>
</div>
